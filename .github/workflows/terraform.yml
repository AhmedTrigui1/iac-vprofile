name: "Vprofile IAC"
on:
  push:
    branches:
      - main
      - stage
    paths:
      - terraform/**
  pull_request:
    branches:
      - main
    paths:
      - terraform/**

env:
  # Credentials for deployments to AZ
  AZURE_ACCESS_KEY_ID: ${{ secrets.AZURE_ACCESS_KEY_ID }}
  AZURE_SECRET_ACCESS_KEY: ${{ secrets.AZURE_SECRET_ACCESS_KEY }}
  # Blob Storage
  BUCKET_TF_STATE: ${{ secrets.BUCKET_TF_STATE }}
  AZURE_REGION: germany-west-central
  AKS_CLUSTER: vprofile-aks
jobs:
  terraform:
    name: "Apply terraform code changes"
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./terraform
    
    steps:
      - name: Checkout source code
        uses: actions/checkout@v2 

      - name: Setup Terraform with specified version on the runner
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.3

      - name: Terraform init
        id: init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ env.RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ env.AZURE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=vprofieapp" \
            -backend-config="key=terraform.tfstate"

      - name: Terraform format
        id: fmt
        run: terraform fmt -check

      - name: Terraform validate
        id: validate
        run: terraform validate

      - name: Terraform plan
        id: plan
        run: terraform plan -no-color -input=false -out planfile
        continue-on-error: true
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_ACCESS_KEY_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_SECRET_ACCESS_KEY }}


      - name: Terraform plan status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Terraform Apply
        id: apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -input=false -parallelism=1 planfile
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_ACCESS_KEY_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_SECRET_ACCESS_KEY }}


      - name: Get AKS credentials
        id: getconfig
        if: steps.apply.outcome == 'success'
        run: |
          az aks get-credentials \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER }} \
            --overwrite-existing

      - name: Install Ingress controller
        if: steps.apply.outcome == 'success' && steps.getconfig.outcome == 'success'
        run: |
          # Install NGINX Ingress Controller for Azure AKS
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.8.2/deploy/static/provider/cloud/deploy.yaml
          
          # Wait for the ingress controller to be ready
          kubectl wait --namespace ingress-nginx \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=300s

      - name: Verify cluster status
        if: steps.apply.outcome == 'success' && steps.getconfig.outcome == 'success'
        run: |
          echo "Cluster nodes:"
          kubectl get nodes
          echo "Ingress controller status:"
          kubectl get pods -n ingress-nginx
          echo "Services:"
          kubectl get svc -n ingress-nginx